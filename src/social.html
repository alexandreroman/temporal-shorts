<!doctype html>
<!-- Link preview card of the home page: scripts/social_images.py captures it at 1200x630 into social.png. Not a
     site page: the HTML build skips it. Its lockup and background are the home page's (.brand in home.css,
     home.js); the step chain is a still of the intro of durable-execution (scenes/00-intro.js). -->
<html lang="en"><head><meta charset="utf-8">
<title>Temporal Shorts: social card</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="home.css">
<style>
/* Declared after home.css, with the same specificity as its .home rules: these win where both apply. */
.social main{display:flex;flex-direction:column;align-items:center;padding:0}

/* The "Temporal shorts" lockup of the home page header (.home .brand in home.css), scaled up for the card: every
   size and offset of the lockup derives from --logo. */
.social .brand{--logo:130px}

/* The 4 steps of the order, as on the intro of durable-execution: 2 done, the third retrying, the last pending. */
.chain{display:flex;align-items:center;margin-top:64px}
.chain .tile{position:relative;display:flex;align-items:center;justify-content:center;width:96px;height:96px}
.chain .link{width:56px;height:2px;background:var(--line)}
.chain svg{display:block;fill:none;stroke-linecap:square;stroke-linejoin:miter}
.chain .icon{width:44px;height:44px;stroke:var(--ink);stroke-width:1.7}
/* status badge on the top right corner of a tile, as the status marks of the step tiles in the videos */
.chain .badge{position:absolute;top:6px;right:6px;width:24px;height:24px;stroke-width:2.6}
.chain .tile.done{border-color:var(--neon)}
.chain .tile.done .badge{stroke:var(--neon)}
.chain .link.done{background:var(--neon)}
.chain .tile.retrying{border-color:var(--violet)}
.chain .tile.retrying .badge{stroke:var(--violet);stroke-width:2.4}
</style>
</head>
<body class="home social">
<div class="sky" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<main>
  <h1 class="brand"><img src="assets/temporal-logo-horizontal-light-cropped.svg" alt="Temporal"> shorts</h1>
  <!-- Icon paths: card, box, mail, check and retry from ICONS in src/engine.js, truck from
       src/themes/durable-execution/shared.js (24 grid). engine.js is not loaded: it needs the video stage. -->
  <div class="chain" aria-hidden="true">
    <div class="tile done">
      <svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14"/>
        <path d="M2.5 9.5h19M6 15h5"/></svg>
      <svg class="badge" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </div>
    <div class="link done"></div>
    <div class="tile done">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3l8.5 4.5v9L12 21l-8.5-4.5v-9z"/>
        <path d="M3.5 7.5L12 12l8.5-4.5M12 12v9M7.8 5.3l8.5 4.5"/></svg>
      <svg class="badge" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </div>
    <div class="link done"></div>
    <div class="tile retrying">
      <svg class="icon" viewBox="0 0 24 24"><path d="M14 18V5H2v13h3M9 18h6M19 18h3v-5l-4-5h-4"/>
        <circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      <svg class="badge" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </div>
    <div class="link"></div>
    <div class="tile">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13"/><path d="M3 7l9 6 9-6"/></svg>
    </div>
  </div>
</main>
<script src="home.js"></script>
</body></html>
