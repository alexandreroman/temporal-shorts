<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="stage">
  <div id="sky"></div><div id="band"></div>
  <div id="hdr"><span class="num">01</span><span class="ttl"></span></div>
  <div id="segs"></div>
  <div id="subw"><div id="sub"></div></div>
</div>
<script>
// deterministic star field
(function(){let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};const sky=document.getElementById('sky');
for(let i=0;i<110;i++){const e=document.createElement('i');e.style.left=(r()*1920)+'px';e.style.top=(r()*1080)+'px';e.style.opacity=(0.08+r()*0.35).toFixed(2);if(r()>.85){e.style.width=e.style.height='3px'}sky.appendChild(e);}})();
</script>
<script src="engine.js"></script>
<script src="shared.js"></script>
<!-- Scenes play in the order they are listed. -->
<script src="scenes/00-intro.js"></script>
<script src="scenes/01-llm-call.js"></script>
<script src="scenes/02-stateless.js"></script>
<script src="scenes/03-context-window.js"></script>
<script src="scenes/04-tools.js"></script>
<script src="scenes/05-agentic-loop.js"></script>
<script src="scenes/06-crash.js"></script>
<script src="scenes/07-temporal.js"></script>
<script src="scenes/99-outro.js"></script>
<script src="player.js"></script>
<script>
buildAll();
const st=document.getElementById('stage');
['hdr','segs','subw'].forEach(id=>st.appendChild(document.getElementById(id)));
const q=new URLSearchParams(location.search);
if(q.has('t')) renderAt(parseFloat(q.get('t')));
else startPlayer();
</script>
</body></html>
