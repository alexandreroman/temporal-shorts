<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
/* Fonts: stand-ins for Temporal's Aeonik / Noto Sans Mono (not available here). Fetched by scripts/setup.sh.
   Each src list tries the static TTF first, then the Fontsource woff2. */
@font-face{font-family:'Brand';src:url(fonts/InstrumentSans-Regular.ttf),url(fonts/instrument-sans-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Brand';src:url(fonts/InstrumentSans-Bold.ttf),url(fonts/instrument-sans-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:'Mono';src:url(fonts/JetBrainsMono-Regular.ttf),url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Mono';src:url(fonts/JetBrainsMono-Bold.ttf),url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2');font-weight:700}
:root{--bg:#141414;--ink:#F8FAFC;--slate:#94A3B8;--line:#333A46;--uv:#444CE7;--violet:#B664FF;--neon:#DBFF4B;--red:#FF5A5F;--surface:#1B1B1F;--r:10px;--rs:6px;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:'Brand',sans-serif;color:var(--ink)}
#sky{position:absolute;inset:0}
#sky i{position:absolute;width:2px;height:2px;background:#F8FAFC;border-radius:50%}
#band{position:absolute;left:-10%;right:-10%;bottom:0;height:520px;background:radial-gradient(ellipse at 50% 100%,rgba(182,100,255,.20), rgba(68,76,231,.12) 40%, rgba(20,20,20,0) 70%)}
.scene{position:absolute;inset:0;display:none}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
.layer{position:absolute;left:0;top:0;pointer-events:none}
.mono{font-family:'Mono',monospace}
#hdr{position:absolute;left:80px;top:54px;display:flex;align-items:center;gap:14px;opacity:0;font-family:'Mono';font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
#hdr .num{color:var(--ink)}
#hdr .num:after{content:' /';color:var(--slate)}
#segs{position:absolute;right:80px;top:64px;display:flex;gap:6px;opacity:0}
#segs i{display:block;width:56px;height:3px;border-radius:2px;background:rgba(248,250,252,.14);overflow:hidden}
#segs b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--uv))}
#subw{position:absolute;left:0;right:0;bottom:50px;display:flex;justify-content:center;opacity:0}
#sub{max-width:1760px;text-align:center;font-size:30px;line-height:1.36;color:var(--ink);background:rgba(0,0,0,.86);padding:12px 30px 14px;border-bottom:3px solid var(--uv);border-radius:var(--r)}
/* LLM orb */
.llm-glow{position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle, rgba(182,100,255,.35) 0%, rgba(68,76,231,.12) 40%, rgba(68,76,231,0) 68%)}
.llm-body{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%, #D7A8FF 0%, #B664FF 30%, #6A55F0 62%, #444CE7 100%)}
.llm-eye{position:absolute;top:34%;width:1.6em;height:2.2em;border-radius:50%;background:#F8FAFC;overflow:hidden}
.llm-eye.l{left:28%}.llm-eye.r{right:28%}
.pupil{position:absolute;left:.42em;top:.7em;width:.8em;height:.9em;border-radius:50%;background:#141414}
.llm-dots{position:absolute;right:-1.3em;top:-1.4em;display:flex;gap:.3em;background:#F8FAFC;padding:.45em .6em;border-radius:var(--rs);opacity:0}
.llm-dots i{display:block;width:.55em;height:.55em;background:var(--uv);border-radius:2px}
.llm-q{position:absolute;left:-1.2em;top:-1.6em;font-size:2.6em;font-weight:700;color:var(--neon);opacity:0}
.llm-label,.app-label{position:absolute;left:50%;top:calc(100% + 18px);transform:translateX(-50%);white-space:nowrap;font-family:'Mono';font-size:22px;letter-spacing:.12em;padding-left:.12em;color:var(--slate)}
/* app */
.app{width:300px;height:220px}
.app-win{position:absolute;inset:0;background:var(--surface);border:1.5px solid #4B5363;border-radius:var(--r);overflow:hidden}
.app-bar{height:32px;border-bottom:1.5px solid #4B5363;display:flex;gap:8px;align-items:center;padding-left:14px}
.app-bar i{width:9px;height:9px;background:var(--slate);opacity:.6;border-radius:2px}
.app-lines{padding:24px 22px;display:flex;flex-direction:column;gap:16px}
.app-lines b{display:block;height:10px;background:rgba(248,250,252,.18);border-radius:3px}
.app-gear{position:absolute;right:18px;bottom:14px;opacity:.35}
/* text cards */
.card{max-width:640px;background:var(--ink);color:var(--bg);padding:12px 22px 14px;border-left:6px solid var(--violet);border-radius:var(--r)}
.card .who{font-family:'Mono';font-size:16px;letter-spacing:.12em;color:#5B6475;margin-bottom:4px}
.card .txt{font-family:'Mono';font-size:27px;line-height:1.35}
.k-user{border-left-color:var(--violet)} .k-llm{border-left-color:var(--uv)} .k-tool{border-left-color:var(--neon)}
.k-ok{border-left-color:var(--uv)} .k-bad{border-left-color:var(--red)}
.pill{white-space:nowrap;padding:9px 18px 9px calc(18px + .1em);background:rgba(248,250,252,.04);border:1.5px solid #4B5363;font-family:'Mono';font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);border-radius:var(--rs)}
.pill.big{font-size:30px;padding:12px 26px 12px calc(26px + .1em)}
.pill.uv{border-color:var(--uv);background:rgba(68,76,231,.18)}
.pill.violet{border-color:var(--violet);background:rgba(182,100,255,.14)}
.pill.neon{border-color:var(--neon);color:var(--neon);background:rgba(219,255,75,.08)}
.pill.red{border-color:var(--red);color:var(--red);background:rgba(255,90,95,.1)}
.lbl{white-space:nowrap;font-family:'Mono';font-size:20px;letter-spacing:.12em;padding-left:.12em;text-transform:uppercase;color:var(--slate)}
.tile{background:var(--surface);border:1.5px solid #3A4150;border-radius:var(--r);text-align:center}
.big-t{white-space:nowrap}
/* Live player (page opened without ?t=): fit-to-window stage and playback controls.
   Every rule targets .live or the #ctl overlay, both created by startPlayer() only, so the frozen
   ?t= frames used by the renderer stay pixel-identical. */
.live,.live body{height:100%;overflow:hidden}
.live #stage{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
.live.idle body{cursor:none}
/* While the controls are shown, lift the subtitle above them (--sub-lift is in stage pixels, set by fit()). */
.live #subw{transition:transform .3s}
.live:not(.idle) #subw{transform:translateY(calc(-1 * var(--sub-lift, 0px)))}
.live.no-subs #subw{visibility:hidden}
#ctl{position:fixed;left:50%;bottom:20px;z-index:1;transform:translateX(-50%);width:min(880px,calc(100% - 32px));display:flex;align-items:center;gap:14px;padding:8px 14px;background:rgba(20,20,20,.88);border:1px solid var(--line);border-radius:var(--rs);color:var(--ink);transition:opacity .3s}
.idle #ctl{opacity:0;pointer-events:none}
#ctl button{display:flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;padding:0;border:0;background:none;color:var(--ink);border-radius:var(--rs);cursor:pointer}
#ctl button[hidden]{display:none}
#ctl button:hover{background:rgba(248,250,252,.08)}
#ctl button:focus-visible{outline:2px solid var(--uv);outline-offset:1px}
#ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#seek{flex:1;height:28px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#seek i{display:block;width:100%;height:4px;border-radius:2px;background:rgba(248,250,252,.14)}
#seek b{position:relative;display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--uv))}
#seek b:after{content:'';position:absolute;right:-6px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:3px;background:var(--ink);opacity:0;transition:opacity .15s}
#seek:hover b:after,#seek.drag b:after{opacity:1}
#time{flex:none;font-family:'Mono',monospace;font-size:14px;letter-spacing:.06em;color:var(--slate);white-space:nowrap}
</style></head>
<body>
<div id="stage">
  <div id="sky"></div><div id="band"></div>
  <div id="hdr"><span class="num">01</span><span class="ttl"></span></div>
  <div id="segs"></div>
  <div id="subw"><div id="sub"></div></div>
</div>
<script>
// deterministic star field
(function(){let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};const sky=document.getElementById('sky');
for(let i=0;i<110;i++){const e=document.createElement('i');e.style.left=(r()*1920)+'px';e.style.top=(r()*1080)+'px';e.style.opacity=(0.08+r()*0.35).toFixed(2);if(r()>.85){e.style.width=e.style.height='3px'}sky.appendChild(e);}})();
</script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
// Live player: started only when the page is opened without ?t=. Frozen mode never runs this code.
function startPlayer() {
  const root = document.documentElement;
  const stage = document.getElementById('stage');
  root.classList.add('live');

  const CC_LETTERS = '<path d="M10.5 10a2.5 2.5 0 1 0 0 4M17 10a2.5 2.5 0 1 0 0 4"/>';
  const ICON_PATHS = {
    play: '<path d="M7 4.5v15l12-7.5z"/>',
    pause: '<path d="M8 5v14M16 5v14"/>',
    replay: '<path d="M4.6 15a8 8 0 1 0 1.8-8.7L4 8.5"/><path d="M4 3.5v5h5"/>',
    enterFullscreen: '<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
    exitFullscreen: '<path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/>',
    subtitlesOn: '<rect x="2" y="4.5" width="20" height="15" rx="3"/>' + CC_LETTERS,
    // Same frame, opened where the slash crosses it so the slash stays legible at 20 px.
    subtitlesOff: '<path d="M8.5 4.5H19a3 3 0 0 1 3 3v8M15.5 19.5H5a3 3 0 0 1-3-3v-9"/><path d="M3 3l18 18"/>'
      + CC_LETTERS,
  };
  function setIcon(button, name, label) {
    if (button.dataset.icon === name) return;
    button.dataset.icon = name;
    button.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[name]}</svg>`;
    button.setAttribute('aria-label', label);
  }

  // The overlay lives outside #stage so it keeps its size whatever the stage scale.
  const ctl = document.createElement('div');
  ctl.id = 'ctl';
  ctl.innerHTML = '<button type="button" id="play"></button><div id="seek"><i><b></b></i></div>'
    + '<span id="time"></span><button type="button" id="subs"></button><button type="button" id="fs"></button>';
  document.body.appendChild(ctl);
  const playButton = document.getElementById('play');
  const subtitlesButton = document.getElementById('subs');
  const fullscreenButton = document.getElementById('fs');
  const seekBar = document.getElementById('seek');
  const seekFill = seekBar.querySelector('b');
  const timeLabel = document.getElementById('time');

  // Scale the 1920x1080 stage to fit the window, centered; the body background letterboxes it.
  function fit() {
    const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = `translate(-50%,-50%) scale(${scale})`;
    // The subtitle sits 50 stage px above the stage bottom. If the controls cover it, compute how far
    // to lift it (in stage px) so it clears them with a 12 px screen margin.
    const letterboxBelow = (innerHeight - 1080 * scale) / 2;
    const subtitleBottom = letterboxBelow + 50 * scale;
    const controlsTop = innerHeight - ctl.getBoundingClientRect().top;
    const lift = Math.max(0, controlsTop + 12 - subtitleBottom) / scale;
    stage.style.setProperty('--sub-lift', `${lift}px`);
  }
  addEventListener('resize', fit);
  fit();

  let time = 0;
  let playing = true;
  let dragging = false;
  let lastTick = performance.now();
  let hideTimer = 0;
  let subtitlesShown = true;

  function formatTime(seconds) {
    const s = Math.floor(seconds);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function updateControls() {
    if (playing) setIcon(playButton, 'pause', 'Pause');
    else if (time >= TOTAL) setIcon(playButton, 'replay', 'Replay');
    else setIcon(playButton, 'play', 'Play');
    seekFill.style.width = (time / TOTAL * 100) + '%';
    timeLabel.textContent = `${formatTime(time)} / ${formatTime(TOTAL)}`;
    if (!playing) root.classList.remove('idle');
  }

  function show() {
    renderAt(time);
    updateControls();
  }

  function seek(t) {
    time = clamp(t, 0, TOTAL);
    show();
  }

  function togglePlay() {
    if (playing) {
      playing = false;
    } else {
      if (time >= TOTAL) time = 0;
      playing = true;
    }
    show();
    wake();
  }

  // Hidden with a class rather than in renderAt(), which keeps driving the subtitle's text and opacity.
  function toggleSubtitles() {
    subtitlesShown = !subtitlesShown;
    root.classList.toggle('no-subs', !subtitlesShown);
    updateSubtitlesButton();
  }

  function updateSubtitlesButton() {
    // A toggle button keeps one label; aria-pressed tells assistive technologies whether it is on.
    setIcon(subtitlesButton, subtitlesShown ? 'subtitlesOn' : 'subtitlesOff', 'Subtitles');
    subtitlesButton.setAttribute('aria-pressed', String(subtitlesShown));
  }

  function toggleFullscreen() {
    if (!document.fullscreenEnabled) return;
    if (document.fullscreenElement) document.exitFullscreen();
    else root.requestFullscreen();
  }

  function updateFullscreenButton() {
    if (document.fullscreenElement) setIcon(fullscreenButton, 'exitFullscreen', 'Exit fullscreen');
    else setIcon(fullscreenButton, 'enterFullscreen', 'Fullscreen');
  }

  // Show the controls, then hide them (and the cursor) after 2.5 s without activity while playing.
  function wake() {
    root.classList.remove('idle');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
      if (playing && !dragging && !ctl.matches(':hover')) root.classList.add('idle');
    }, 2500);
  }

  function tick() {
    const now = performance.now();
    // Cap the step: a background tab gets no frames and should resume where it stopped, not jump ahead.
    const dt = Math.min((now - lastTick) / 1000, 0.25);
    lastTick = now;
    if (playing && !dragging) {
      time += dt;
      if (time >= TOTAL) {
        time = TOTAL; // stop on the last frame instead of looping
        playing = false;
      }
      show();
    }
    requestAnimationFrame(tick);
  }

  function seekToPointer(event) {
    const box = seekBar.getBoundingClientRect();
    seek((event.clientX - box.left) / box.width * TOTAL);
  }

  function endDrag() {
    dragging = false;
    seekBar.classList.remove('drag');
    wake();
  }

  seekBar.addEventListener('pointerdown', event => {
    dragging = true;
    seekBar.classList.add('drag');
    seekBar.setPointerCapture(event.pointerId);
    seekToPointer(event);
  });
  seekBar.addEventListener('pointermove', event => {
    if (dragging) seekToPointer(event);
  });
  seekBar.addEventListener('pointerup', endDrag);
  seekBar.addEventListener('pointercancel', endDrag);

  playButton.addEventListener('click', togglePlay);
  subtitlesButton.addEventListener('click', toggleSubtitles);
  fullscreenButton.addEventListener('click', toggleFullscreen);
  fullscreenButton.hidden = !document.fullscreenEnabled;
  // Keep mouse clicks from focusing the buttons, so Space stays a global play/pause key.
  // Keyboard users can still Tab to a button and activate it natively.
  for (const button of [playButton, subtitlesButton, fullscreenButton]) {
    button.addEventListener('mousedown', event => event.preventDefault());
  }

  document.addEventListener('keydown', event => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.key === ' ' && event.target instanceof HTMLButtonElement) return;
    if (event.key === ' ') togglePlay();
    else if (event.key === 'ArrowLeft') seek(time - 5);
    else if (event.key === 'ArrowRight') seek(time + 5);
    else if (event.key === 'c' || event.key === 'C') toggleSubtitles();
    else if (event.key === 'f' || event.key === 'F') toggleFullscreen();
    else return;
    event.preventDefault();
    wake();
  });
  document.addEventListener('mousemove', wake);
  document.addEventListener('fullscreenchange', updateFullscreenButton);

  updateSubtitlesButton();
  updateFullscreenButton();
  show();
  wake();
  requestAnimationFrame(tick);
}
</script>
<script>
buildAll();
const st=document.getElementById('stage');
['hdr','segs','subw'].forEach(id=>st.appendChild(document.getElementById(id)));
const q=new URLSearchParams(location.search);
if(q.has('t')) renderAt(parseFloat(q.get('t')));
else startPlayer();
</script>
</body></html>
